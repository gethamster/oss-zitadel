name: System provider qualification

on:
  pull_request:
    paths:
      - internal/authz/**
      - internal/command/session*
      - internal/webauthn/**
      - go.mod
      - go.sum
      - .github/workflows/system-qualification.yml
  push:
    branches: [main, codex/eddsa-api-verifier]
    paths:
      - internal/authz/**
      - internal/command/session*
      - internal/webauthn/**
      - go.mod
      - go.sum
      - .github/workflows/system-qualification.yml

permissions:
  contents: read

concurrency:
  group: system-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-token-verifier:
    runs-on: oss-ubuntu24-x64
    timeout-minutes: 30
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Verify API token authentication
        run: pnpm nx run @zitadel/api:test-unit --skipNxCache --command='go test -race ./internal/authz/repository/eventsourcing/eventstore -count=1 -v'
      - name: Verify discoverable passkey authentication
        run: pnpm nx run @zitadel/api:test-unit --skipNxCache --command='go test -race ./internal/command ./internal/webauthn -run "TestSessionDiscoverablePasskey|TestDiscoverablePasskeyRejectsU2F|TestSessionCommands_getHumanWebAuthNTokens|TestConfig_serverFromContext" -count=1 -v'
